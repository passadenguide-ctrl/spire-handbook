<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./spire-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ШПИЛЬ: Город Должен Пасть</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Converts direct path (e.g. /spire-handbook/lore/gods) to hash route (/#/lore/gods)
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var repo = parts.length > 0 && parts[0] === 'spire-handbook' ? 'spire-handbook' : '';
        if (repo) {
          parts.shift();
        }
        var route = parts.length > 0 ? '/' + parts.join('/') : '/';
        var base = repo ? '/' + repo + '/' : '/';
        var query = window.location.search || '';
        var hash = window.location.hash || '';
        
        var targetUrl = window.location.origin + base + '#' + route + query + (hash ? '&' + hash.replace(/^#/, '') : '');
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="background-color: #0b0c10; color: #e0dacf; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #f5d061; letter-spacing: 2px;">ШПИЛЬ: ГОРОД ДОЛЖЕН ПАСТЬ</h2>
      <p style="color: #9c9587;">Перенаправление к выбранному разделу...</p>
    </div>
  </body>
</html>
